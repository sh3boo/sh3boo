name: Refresh profile animations and pulse
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-pulse.yml
permissions:
  contents: write
concurrency:
  group: profile-pulse
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate public GitHub snapshot
        run: |
          python3 scripts/update_profile.py
          mv assets/pulse-dark.svg assets/3-pulse-dark.svg
          mv assets/pulse-light.svg assets/4-pulse-light.svg
      - name: Generate contribution snake from public GitHub calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: sh3boo
          outputs: |
            assets/6-snake-light.svg?color_snake=#a78bfa
            assets/5-snake-dark.svg?palette=github-dark&color_snake=#a78bfa
      - name: Commit changed images only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/3-pulse-dark.svg assets/4-pulse-light.svg assets/5-snake-dark.svg assets/6-snake-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution snake and public GitHub pulse'
            git push
          fi
